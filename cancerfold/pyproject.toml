[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cancerfold"
version = "0.1.0"
description = "Stochastic physics-guided extension of AlphaFold for modeling somatic cancer mutation ensembles in JAX."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "Yovan Fabiano Maitlen"},
  {name = "NeuroSon Computational Team"},
]
dependencies = [
  "jax>=0.4.25",
  "jaxlib>=0.4.25",
  "dm-haiku>=0.0.12",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["cancerfold*"]
